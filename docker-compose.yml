version: '3.8'

services:
  # 1. PostgreSQL 15 with PostGIS Spatial Extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: aquasentinel-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aquasentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aquasentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aquanet

  # 2. Python AI/ML Anomaly Detection & Outbreak Correlation Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: aquasentinel-ml
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - aquanet
    restart: unless-stopped

  # 3. Node.js / Express Backend with WebSocket Gateway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquasentinel-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/aquasentinel
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGIN=*
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - aquanet
    restart: unless-stopped

  # 4. React + Leaflet Admin Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquasentinel-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - aquanet
    restart: unless-stopped

networks:
  aquanet:
    driver: bridge

volumes:
  pgdata:
